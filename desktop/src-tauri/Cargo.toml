[package]
name = "qronos-desktop"
version = "0.1.0"
description = "Qronos Agent desktop application"
authors = ["Qronos"]
edition = "2021"

[lib]
name = "qronos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "=2.3.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sysinfo = "0.36"
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_IO"] }
