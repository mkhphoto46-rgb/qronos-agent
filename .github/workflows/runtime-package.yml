name: Standalone Runtime

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Build and exercise standalone Windows backend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install pinned runtime and packaging dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Build standalone backend and verify complete manifest
        run: python -m build_support.build_runtime --destination runtime/package
      - name: Exercise frozen services outside the source checkout
        run: python -m build_support.smoke_runtime --executable runtime/package/qronos-runtime/qronos-runtime.exe --profile runtime/smoke-profile
