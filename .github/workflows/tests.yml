name: Qronos Tests

on:
  # Every branch. The list used to name five prefixes, so a branch called
  # anything else pushed twenty commits without a single check running and
  # nothing said so. A branch that costs nothing to test should be tested.
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    # Windows is the platform Qronos ships on, and it is the one the suite was
    # never run against. Three failures lived on main for weeks behind a green
    # Ubuntu badge: two paths that Windows resolves where POSIX raises, and a
    # file permission check that Windows cannot express as a mode at all.
    #
    # The two jobs also install different dependency sets — openwakeword is
    # pinned to `platform_system == "Windows"` — so the Windows job exercises
    # code the Linux job never imports.
    name: Run Qronos Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Both results, every time. Stopping at the first failure would hide
      # whether a break is platform-specific, which is the question this
      # matrix exists to answer.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Display Python version
        run: python --version

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Check Python dependencies
        run: python -m pip check

      - name: Verify CI source
        # Explicit bash: the Windows runner defaults to PowerShell, which has
        # no sed.
        shell: bash
        run: |
          echo "===== COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

          echo "===== test_config.py ====="
          sed -n '1,80p' tests/test_config.py

          echo "===== test_ollama_controller.py ====="
          sed -n '1,160p' tests/test_ollama_controller.py

      - name: Run Qronos tests
        run: |
          python -m unittest discover -s tests -v
